[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --strict-config
filterwarnings =
    error
    # Starlette's TestClient still imports httpx; the deprecation is theirs, not ours, and
    # failing the suite on it would block on an upstream release.
    ignore::DeprecationWarning
    default::UserWarning
markers =
    slow: trains a model, so it takes seconds rather than milliseconds
