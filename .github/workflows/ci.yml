name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 25 unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Docker is available
        run: docker info
      - name: Run the complete Maven lifecycle
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify
      - name: Prove all integration suites executed
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          unit_reports = sorted(Path('.').glob('*/target/surefire-reports/TEST-*.xml'))
          unit_suites = [ET.parse(path).getroot() for path in unit_reports]
          unit_tests = sum(int(suite.attrib['tests']) for suite in unit_suites)
          unit_failures = sum(int(suite.attrib['failures']) for suite in unit_suites)
          unit_errors = sum(int(suite.attrib['errors']) for suite in unit_suites)
          unit_skipped = sum(int(suite.attrib['skipped']) for suite in unit_suites)
          print(f"Surefire reports={len(unit_suites)} tests={unit_tests} failures={unit_failures} errors={unit_errors} skipped={unit_skipped}")
          assert unit_suites, "Surefire produced no unit-test reports"
          assert unit_failures == unit_errors == unit_skipped == 0

          reports = sorted(Path('.').glob('*/target/failsafe-reports/TEST-*.xml'))
          suites = [ET.parse(path).getroot() for path in reports]
          tests = sum(int(suite.attrib['tests']) for suite in suites)
          failures = sum(int(suite.attrib['failures']) for suite in suites)
          errors = sum(int(suite.attrib['errors']) for suite in suites)
          skipped = sum(int(suite.attrib['skipped']) for suite in suites)
          print(f"Failsafe classes={len(suites)} tests={tests} failures={failures} errors={errors} skipped={skipped}")
          assert len(suites) == 16, "Docker-backed CI must execute all 16 integration classes"
          assert tests == 432, "the complete integration contract currently contains 432 tests"
          assert failures == errors == skipped == 0
      - name: Upload Java reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python ML tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pytest

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  configuration:
    name: Compose and Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.6
      - name: Lint and render Helm chart
        run: |
          helm lint --strict infrastructure/kubernetes/aegispay
          helm template aegispay infrastructure/kubernetes/aegispay --namespace aegispay > rendered.yaml
      - name: Validate production policy in the chart itself
        shell: bash
        run: |
          set -euo pipefail
          base=(
            --set-string global.deploymentProfile=production
            --set-string global.image.namespace=aegispay
            --set-string global.image.tag=0123456789abcdef0123456789abcdef01234567
            --set-string global.publicGatewayUrl=https://pay.company.test
            --set-string global.jwtIssuer=https://pay.company.test
            --set ingress.enabled=true
            --set-string ingress.host=pay.company.test
            --set infrastructure.postgresql.enabled=false
            --set-string infrastructure.postgresql.host=postgres.company.test
            --set infrastructure.redis.enabled=false
            --set-string infrastructure.redis.host=redis.company.test
            --set infrastructure.kafka.enabled=false
            --set-string 'infrastructure.kafka.bootstrapServers=kafka.company.test:9092'
          )
          helm template production-check infrastructure/kubernetes/aegispay "${base[@]}" >/dev/null
          for unsafe in \
            'infrastructure.postgresql.sslMode=disable' \
            'infrastructure.redis.sslEnabled=false' \
            'infrastructure.kafka.securityProtocol=PLAINTEXT' \
            'applicationConfig.allowUnassessedPayments=true' \
            'applicationConfig.demoSeedEnabled=true'; do
            if helm template rejected infrastructure/kubernetes/aegispay "${base[@]}" \
                --set "$unsafe" >/dev/null 2>&1; then
              echo "production policy accepted unsafe override: $unsafe" >&2
              exit 1
            fi
          done
      - name: Validate rendered Kubernetes resources
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /work/rendered.yaml
