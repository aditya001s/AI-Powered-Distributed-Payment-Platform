name: Build, scan, and publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    environment: image-publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api-gateway, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=api-gateway\nSERVICE_PORT=8080" }
          - { image: auth-service, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=auth-service\nSERVICE_PORT=8081" }
          - { image: wallet-service, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=wallet-service\nSERVICE_PORT=8082" }
          - { image: ledger-service, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=ledger-service\nSERVICE_PORT=8083" }
          - { image: payment-service, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=payment-service\nSERVICE_PORT=8084" }
          - { image: payment-orchestrator, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=payment-orchestrator\nSERVICE_PORT=8085" }
          - { image: fraud-service, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=fraud-service\nSERVICE_PORT=8086" }
          - { image: ai-investigation-service, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=ai-investigation-service\nSERVICE_PORT=8087" }
          - { image: notification-service, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=notification-service\nSERVICE_PORT=8088" }
          - { image: analytics-service, context: ., file: infrastructure/docker/Dockerfile.service, build_args: "MODULE=analytics-service\nSERVICE_PORT=8089" }
          - { image: ml-service, context: ml-service, file: ml-service/Dockerfile, build_args: "" }
          - { image: frontend, context: ., file: infrastructure/docker/Dockerfile.frontend, build_args: "VITE_APP_NAME=AegisPay" }
    steps:
      - name: Require successful same-SHA security workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for workflow in Security CodeQL; do
            for attempt in {1..90}; do
              result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$SOURCE_SHA" --event push --limit 1 --json status,conclusion --jq '.[0] | [.status, .conclusion] | @tsv')"
              status="${result%%$'\t'*}"
              conclusion="${result#*$'\t'}"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || { echo "$workflow concluded $conclusion for $SOURCE_SHA" >&2; exit 1; }
                break
              fi
              [[ "$attempt" -lt 90 ]] || { echo "Timed out waiting for $workflow on $SOURCE_SHA" >&2; exit 1; }
              sleep 20
            done
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable image coordinates
        shell: bash
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
      - name: Build locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          load: true
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Block vulnerable images
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 90
      - name: Publish scanned immutable image
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
