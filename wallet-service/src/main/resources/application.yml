###############################################################################
# wallet-service
#
# Wallet balances and fund reservations. Owns customer wallet balances in
# integer minor units, and the reserve / capture / release hold lifecycle
# the payment saga depends on. Balance correctness is guaranteed by
# row-level locking inside a database transaction; the Redis distributed
# lock in front of it only reduces contention.
#
# Hosts and secrets come from the environment. Shared platform defaults are
# imported from platform-common's aegis-defaults.yml, which this file overrides.
###############################################################################

spring:
  application:
    name: wallet-service

  config:
    import: "classpath:aegis-defaults.yml"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${WALLET_DB_NAME:aegis_wallet}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Flyway owns the schema. validate turns a mapping/schema mismatch into a
      # startup failure instead of a silent ALTER against a live database.
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys are fetched from the auth service. This service therefore
          # holds no signing material and cannot mint a token, so compromising it
          # does not yield the ability to forge identities.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.aegispay.local}

server:
  port: ${SERVER_PORT:8082}

# ------------------------------------------------------------------ platform ---
aegis:
  platform-env: ${PLATFORM_ENV:local}
  gateway-url: ${GATEWAY_URL:http://localhost:8080}

  clients:
    ledger-service-url: ${LEDGER_SERVICE_URL:http://localhost:8083}

  openapi:
    description: >-
      Owns customer wallet balances in integer minor units, and the reserve / capture / release hold lifecycle the payment saga depends on. Balance correctness is guaranteed by row-level locking inside a database transaction; the Redis distributed lock in front of it only reduces contention.

  # Use the shared deny-by-default resource-server chain from platform-common.
  security:
    standard-chain:
      enabled: true

  # Credentials for outbound service-to-service calls (OAuth2 client credentials).
  service-auth:
    enabled: true
    token-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/api/auth/token
    client-id: ${INTERNAL_CLIENT_ID:aegis-internal}
    client-secret: ${INTERNAL_CLIENT_SECRET:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # A distinct group per service: each one needs its own copy of every event.
    # Sharing a group id would make services steal each other's partitions.
    consumer-group-id: wallet-service

  outbox:
    # This service emits domain events, so it records them to the outbox inside
    # the business transaction and drains them to Kafka asynchronously.
    enabled: true

  # Deposits and withdrawals are money-moving and externally retried, so they run
  # through the database-authoritative idempotency store with Redis as a fast path.
  idempotency:
    enabled: true

# --------------------------------------------------------------- api docs ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

