{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegispay.serviceAccountName" . }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aegispay.fullname" . }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "aegispay.componentName" (list . "api-gateway") }}
                port: { name: http }
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ include "aegispay.componentName" (list . "api-gateway") }}
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aegispay.componentName" (list . "frontend") }}
                port: { name: http }
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- range $name, $service := .Values.services }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegispay.componentName" (list $ $name) }}-ingress
  labels:
    {{- include "aegispay.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: {{ $service.port }} }
    {{- if $service.public }}
    - from:
        - namespaceSelector: {{ toYaml $.Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: {{ $service.port }} }
    {{- end }}
---
{{- end }}
{{- range $name := list "postgresql" "redis" "kafka" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegispay.componentName" (list $ $name) }}-ingress
  labels:
    {{- include "aegispay.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
{{- if eq $name "postgresql" }}
      ports: [{ protocol: TCP, port: 5432 }]
{{- else if eq $name "redis" }}
      ports: [{ protocol: TCP, port: 6379 }]
{{- else }}
      ports:
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 9093 }
{{- end }}
---
{{- end }}
{{- if $.Values.monitoring.enabled }}
{{- range $name := list "prometheus" "tempo" "otel-collector" "grafana" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegispay.componentName" (list $ $name) }}-ingress
  labels:
    {{- include "aegispay.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
{{- if eq $name "prometheus" }}
        - { protocol: TCP, port: 9090 }
{{- else if eq $name "tempo" }}
        - { protocol: TCP, port: 3200 }
        - { protocol: TCP, port: 4317 }
{{- else if eq $name "otel-collector" }}
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
        - { protocol: TCP, port: 13133 }
{{- else }}
        - { protocol: TCP, port: 3000 }
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
