{{- if .Values.infrastructure.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegispay.fullname" . }}-postgresql-init
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
data:
  01-init-databases.sh: |-
    #!/bin/sh
    set -eu

    create_database() {
      database="$1"
      role="$2"
      credential="$3"
      psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
        --set=database="$database" --set=role="$role" --set=credential="$credential" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role', :'credential')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
    SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'credential') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'database', :'role')
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'database') \gexec
    SQL
      psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$database" \
        --set=role="$role" <<'SQL'
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    SELECT format('GRANT ALL ON SCHEMA public TO %I', :'role') \gexec
    SQL
    }

    {{- range $name, $service := .Values.services }}
    {{- if $service.database }}
    create_database {{ $service.database | quote }} {{ printf "%s_user" $service.database | quote }} {{ printf "$%s_PASSWORD" (trimSuffix "_NAME" $service.databaseVariable) | quote }}
    {{- end }}
    {{- end }}

    {{- $aiService := index .Values.services "ai-investigation-service" }}
    {{- $authService := index .Values.services "auth-service" }}
    psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname {{ $aiService.database | quote }} \
      -c 'CREATE EXTENSION IF NOT EXISTS vector;'
    psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname {{ $authService.database | quote }} \
      -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
    psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=role="$POSTGRES_USER" --set=credential="$POSTGRES_PASSWORD" <<'SQL'
    SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'credential') \gexec
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegispay.componentName" (list . "postgresql") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
spec:
  selector:
    {{- include "aegispay.selectorLabels" (dict "root" . "name" "postgresql") | nindent 4 }}
  ports:
    - { name: postgresql, port: 5432, targetPort: postgresql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aegispay.componentName" (list . "postgresql") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aegispay.componentName" (list . "postgresql") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" . "name" "postgresql") | nindent 6 }}
  template:
    metadata:
      annotations:
        aegispay.io/runtime-secret-version: {{ .Values.runtimeSecret.version | quote }}
      labels:
        {{- include "aegispay.selectorLabels" (dict "root" . "name" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgresql
          image: {{ .Values.infrastructure.postgresql.image }}
          ports:
            - { name: postgresql, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.infrastructure.postgresql.username | quote }} }
            - { name: POSTGRES_DB, value: aegis_platform }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "aegispay.runtimeSecret" . }}, key: POSTGRES_PASSWORD }
            {{- range $name, $service := .Values.services }}
            {{- if $service.database }}
            - name: {{ printf "%s_PASSWORD" (trimSuffix "_NAME" $service.databaseVariable) }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegispay.runtimeSecret" $ }}
                  key: {{ printf "%s_PASSWORD" (trimSuffix "_NAME" $service.databaseVariable) }}
            {{- end }}
            {{- end }}
          args: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources:
            {{- toYaml .Values.infrastructure.postgresql.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: runtime, mountPath: /var/run/postgresql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: runtime
          emptyDir: {}
        - name: init
          configMap: { name: {{ include "aegispay.fullname" . }}-postgresql-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.infrastructure.postgresql.storage }} }
---
{{- end }}
{{- if .Values.infrastructure.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegispay.componentName" (list . "redis") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  selector:
    {{- include "aegispay.selectorLabels" (dict "root" . "name" "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aegispay.componentName" (list . "redis") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aegispay.componentName" (list . "redis") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" . "name" "redis") | nindent 6 }}
  template:
    metadata:
      annotations:
        aegispay.io/runtime-secret-version: {{ .Values.runtimeSecret.version | quote }}
      labels:
        {{- include "aegispay.selectorLabels" (dict "root" . "name" "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: {{ .Values.infrastructure.redis.image }}
          command: ["sh", "-c"]
          args: ["exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - { name: redis, containerPort: 6379 }
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "aegispay.runtimeSecret" . }}, key: REDIS_PASSWORD }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources:
            {{- toYaml .Values.infrastructure.redis.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"] }
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.infrastructure.redis.storage }} }
---
{{- end }}
{{- if .Values.infrastructure.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegispay.componentName" (list . "kafka") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka
spec:
  selector:
    {{- include "aegispay.selectorLabels" (dict "root" . "name" "kafka") | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
    - { name: controller, port: 9093, targetPort: controller }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegispay.componentName" (list . "kafka-headless") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "aegispay.selectorLabels" (dict "root" . "name" "kafka") | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
    - { name: controller, port: 9093, targetPort: controller }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aegispay.componentName" (list . "kafka") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aegispay.componentName" (list . "kafka-headless") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" . "name" "kafka") | nindent 6 }}
  template:
    metadata:
      annotations:
        aegispay.io/runtime-secret-version: {{ .Values.runtimeSecret.version | quote }}
      labels:
        {{- include "aegispay.selectorLabels" (dict "root" . "name" "kafka") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kafka
          image: {{ .Values.infrastructure.kafka.image }}
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: {{ printf "INTERNAL://%s:9092" (include "aegispay.componentName" (list . "kafka")) | quote }} }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: {{ printf "1@%s-0.%s:9093" (include "aegispay.componentName" (list . "kafka")) (include "aegispay.componentName" (list . "kafka-headless")) | quote }} }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: CLUSTER_ID, value: {{ .Values.infrastructure.kafka.clusterId | quote }} }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources:
            {{- toYaml .Values.infrastructure.kafka.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["sh", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"] }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 40
            periodSeconds: 15
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.infrastructure.kafka.storage }} }
{{- end }}
