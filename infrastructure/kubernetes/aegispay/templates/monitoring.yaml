{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegispay.fullname" . }}-prometheus
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aegispay.fullname" . }}-prometheus-discovery
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aegispay.fullname" . }}-prometheus-discovery
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aegispay.fullname" . }}-prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aegispay.fullname" . }}-prometheus-discovery
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aegispay.componentName" (list . "prometheus") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.monitoring.prometheus.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegispay.componentName" (list . "prometheus") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" . "name" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegispay.selectorLabels" (dict "root" . "name" "prometheus") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/monitoring-config.yaml") . | sha256sum }}
        aegispay.io/runtime-secret-version: {{ .Values.runtimeSecret.version | quote }}
    spec:
      serviceAccountName: {{ include "aegispay.fullname" . }}-prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
            - --web.enable-lifecycle
            - --enable-feature=exemplar-storage
          ports: [{ name: http, containerPort: 9090 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources:
            {{- toYaml .Values.monitoring.prometheus.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /-/healthy, port: http }, periodSeconds: 15 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true }
            - { name: config, mountPath: /etc/prometheus/rules/alerts.yml, subPath: alerts.yml, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: {{ include "aegispay.fullname" . }}-prometheus-config } }
        - { name: data, persistentVolumeClaim: { claimName: {{ include "aegispay.componentName" (list . "prometheus") }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegispay.componentName" (list . "prometheus") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aegispay.selectorLabels" (dict "root" . "name" "prometheus") | nindent 4 }}
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aegispay.componentName" (list . "tempo") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.monitoring.tempo.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegispay.componentName" (list . "tempo") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" . "name" "tempo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegispay.selectorLabels" (dict "root" . "name" "tempo") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/monitoring-config.yaml") . | sha256sum }}
        aegispay.io/runtime-secret-version: {{ .Values.runtimeSecret.version | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: tempo
          image: {{ .Values.monitoring.tempo.image }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources:
            {{- toYaml .Values.monitoring.tempo.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 20, periodSeconds: 15 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo/tempo.yaml, subPath: tempo.yaml, readOnly: true }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - { name: config, configMap: { name: {{ include "aegispay.fullname" . }}-tempo-config } }
        - { name: data, persistentVolumeClaim: { claimName: {{ include "aegispay.componentName" (list . "tempo") }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegispay.componentName" (list . "tempo") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aegispay.selectorLabels" (dict "root" . "name" "tempo") | nindent 4 }}
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegispay.componentName" (list . "otel-collector") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" . "name" "otel-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegispay.selectorLabels" (dict "root" . "name" "otel-collector") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/monitoring-config.yaml") . | sha256sum }}
        aegispay.io/runtime-secret-version: {{ .Values.runtimeSecret.version | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: otel-collector
          image: {{ .Values.monitoring.otelCollector.image }}
          args: ["--config=/etc/otelcol/collector.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources:
            {{- toYaml .Values.monitoring.otelCollector.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /, port: health }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: health }, periodSeconds: 15 }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol/collector.yaml, subPath: collector.yaml, readOnly: true }
      volumes:
        - { name: config, configMap: { name: {{ include "aegispay.fullname" . }}-otel-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegispay.componentName" (list . "otel-collector") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aegispay.selectorLabels" (dict "root" . "name" "otel-collector") | nindent 4 }}
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aegispay.componentName" (list . "grafana") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.monitoring.grafana.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegispay.componentName" (list . "grafana") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aegispay.selectorLabels" (dict "root" . "name" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegispay.selectorLabels" (dict "root" . "name" "grafana") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/monitoring-config.yaml") . | sha256sum }}
        aegispay.io/runtime-secret-version: {{ .Values.runtimeSecret.version | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "aegispay.runtimeSecret" . }}, key: GRAFANA_ADMIN_PASSWORD }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources:
            {{- toYaml .Values.monitoring.grafana.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 20, periodSeconds: 15 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true }
            - { name: dashboard, mountPath: /var/lib/grafana/dashboards/aegispay-overview.json, subPath: aegispay-overview.json, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: {{ include "aegispay.componentName" (list . "grafana") }} } }
        - { name: provisioning, configMap: { name: {{ include "aegispay.fullname" . }}-grafana-provisioning } }
        - { name: dashboard, configMap: { name: {{ include "aegispay.fullname" . }}-grafana-dashboard } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegispay.componentName" (list . "grafana") }}
  labels:
    {{- include "aegispay.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aegispay.selectorLabels" (dict "root" . "name" "grafana") | nindent 4 }}
  ports: [{ name: http, port: 3000, targetPort: http }]
{{- end }}
