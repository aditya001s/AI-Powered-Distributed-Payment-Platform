# =============================================================================
# nginx server block for the AegisPay admin dashboard.
#
# A real file rather than a heredoc inside the Dockerfile, because the shell
# quoting needed to emit a CSP header containing single quotes from a RUN
# instruction is unreadable — and an unreadable security header is one nobody
# will check.
#
# API_UPSTREAM is substituted at container startup. Browser requests remain
# same-origin; this internal upstream is used only when nginx itself receives an
# /api or /.well-known request (Compose or direct Service access).
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Caching ----
    #
    # Hashed asset filenames change whenever their content does, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached. It is what points at the current asset
    # hashes, and a cached copy keeps loading a bundle that no longer exists after
    # a deploy — a blank page that only a hard refresh fixes, reported as "the
    # dashboard is down".
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # A liveness target that does not depend on the bundle existing, so a failed
    # asset copy shows up as a failing container rather than a healthy one
    # serving nothing.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API routing for Compose and direct frontend Service access.
    # Kubernetes Ingress normally routes these paths straight to the gateway.
    # No URI rewrite is used because gateway predicates require the /api prefix.
    location ~ ^/(api(?:/|$)|\.well-known(?:/|$)) {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ---- The SPA fallback ----
    #
    # The part that is easy to get wrong. React Router owns /alerts and /payments;
    # nginx has never heard of them. Without try_files, reloading on /alerts — or
    # following a link somebody pasted into a chat — returns nginx's own 404
    # instead of the application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Response headers ----

    # This console can release or reject a held payment, so it must not be
    # embeddable. A framed copy is how a click on another site becomes a click on
    # a decision button here.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # No referrer at all. A URL here can contain a payment id, and sending that to
    # a third party in a Referer header would leak it outside the platform.
    add_header Referrer-Policy "no-referrer" always;

    # ---- Content Security Policy ----
    #
    # connect-src is same-origin only. The browser never sees API_UPSTREAM; nginx
    # or Kubernetes Ingress forwards /api to the gateway internally.
    #
    # form-action 'none' because nothing here submits a form to a server; every
    # write goes through fetch. It closes off a redirect-to-attacker submission.
    #
    # Two relaxations, both stated rather than hidden:
    #
    #   style-src 'unsafe-inline'  the hand-drawn SVG charts set fill and width as
    #                              inline style attributes. Removing this needs
    #                              nonces on generated markup, which nginx cannot
    #                              add to a static bundle.
    #
    #   img-src data:              inline SVG data URIs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # ---- Transfer ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Source maps are served rather than withheld. The bundle contains no secrets —
    # every credential lives server-side — and an unreadable stack trace costs more
    # than source being readable by somebody who can already read the bundle.
}
